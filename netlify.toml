[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Daily audition digest — 02:00 UTC. To change the schedule, update the cron
# expression here and redeploy. Set DRY_RUN=true in environment variables to
# log which records would be included without sending.
[functions."send-audition-digest"]
  schedule = "0 2 * * *"
