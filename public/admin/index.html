<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SC Theater — Data Editor</title>
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script src="https://unpkg.com/netlify-identity-widget@1/build/netlify-identity-widget.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

:root {
  --ink:      #1c1a17;
  --ink-mid:  #6b6359;
  --ink-faint:#b0a898;
  --bg:       #f5f2ed;
  --surface:  #ffffff;
  --border:   #ddd8cf;
  --accent:   #c0392b;
  --accent2:  #1a6b9a;
  --green:    #2e7d5e;
  --yellow:   #f0a500;
  --sidebar-active: var(--ink);
  --sidebar-w:220px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 13px;
  height: 100vh;
  overflow: hidden;
}

/* ── LOGIN OVERLAY ── */
.login-overlay {
  position: fixed;
  inset: 0;
  background: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.login-card {
  background: var(--surface);
  border-radius: 12px;
  padding: 48px 56px;
  text-align: center;
  max-width: 380px;
  width: 90%;
  box-shadow: 0 32px 96px rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.login-icon { font-size: 52px; line-height: 1; }
.login-title {
  font-family: 'Libre Baskerville', serif;
  font-size: 21px;
  line-height: 1.35;
  color: var(--ink);
}
.login-title span { color: var(--accent); font-style: italic; }
.login-desc { font-size: 13px; color: var(--ink-mid); line-height: 1.5; }
.login-error { font-size: 12px; color: var(--accent); line-height: 1.4; max-width: 260px; }

/* ── APP SHELL ── */
#app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── TOPBAR ── */
.topbar {
  background: var(--ink);
  color: #fff;
  height: 44px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  flex-shrink: 0;
}
.topbar-title {
  font-family: 'Libre Baskerville', serif;
  font-size: 15px;
  letter-spacing: 0.01em;
  flex: 1;
}
.topbar-title span { color: var(--accent); font-style: italic; }
.topbar-brand {
  color: #e2d5b8;
  text-decoration: none;
  transition: color 0.14s;
}
.topbar-brand:hover { color: #d4b87c; }
.topbar-user {
  font-size: 11px;
  color: rgba(255,255,255,0.45);
  font-family: 'IBM Plex Mono', monospace;
}

/* ── SHARED BUTTON STYLES ── */
.btn {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 11px; font-weight: 500;
  padding: 5px 12px;
  border-radius: 3px;
  border: none;
  cursor: pointer;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  transition: opacity 0.15s;
}
.btn:hover { opacity: 0.85; }
.btn-ghost  { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-green  { background: var(--green);  color: #fff; }
.btn-blue   { background: var(--accent2); color: #fff; }
.btn-sm     { font-size: 10px; padding: 3px 8px; }

/* ── HUB VIEW ── */
.hub-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 32px;
  padding: 40px;
}
.hub-heading {
  font-family: 'Libre Baskerville', serif;
  font-size: 22px;
  color: var(--ink);
}
.dataset-grid {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
}
.tile {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 32px 36px;
  width: 240px;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tile:hover {
  border-color: var(--accent2);
  box-shadow: 0 6px 24px rgba(0,0,0,0.1);
  transform: translateY(-2px);
}
.tile-icon  { font-size: 36px; line-height: 1; }
.tile-label { font-family: 'Libre Baskerville', serif; font-size: 16px; color: var(--ink); }
.tile-desc  { font-size: 12px; color: var(--ink-mid); line-height: 1.5; }
.tile-badge {
  display: inline-block;
  margin-top: 4px;
  font-size: 9px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  padding: 3px 8px;
  border-radius: 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--ink-faint);
  width: fit-content;
}

/* ── EDITOR CONTAINER ── */
.editor-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

/* Scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="loginOverlay" class="login-overlay" style="display:none">
  <div class="login-card">
    <div class="login-icon">🎭</div>
    <h1 class="login-title">Santa Cruz Theater<br><span>Data Editor</span></h1>
    <p class="login-desc">Sign in to manage theater data</p>
    <button class="btn btn-accent" id="loginBtn" onclick="openLogin()"
      style="width:100%;padding:10px 0;font-size:13px;margin-top:8px">Sign In</button>
    <p class="login-error" id="loginError" style="display:none"></p>
  </div>
</div>

<!-- APP SHELL -->
<div id="app" style="display:none">
  <div class="topbar">
    <div class="topbar-title"><a id="topbarBrandLink" class="topbar-brand" href="/">Santa Cruz Theater</a> <span id="topbarSubtitle">Data Editor</span></div>
    <button class="btn btn-ghost btn-sm" id="hubBtn" onclick="goHub()" style="display:none">← Editors</button>
    <span id="userLabel" class="topbar-user"></span>
    <button class="btn btn-ghost btn-sm" onclick="signOut()">Sign out</button>
  </div>

  <div id="hubView" class="hub-view">
    <h2 class="hub-heading">What would you like to edit?</h2>
    <div id="datasetTiles" class="dataset-grid"></div>
  </div>

  <div id="editorContainer" class="editor-container" style="display:none"></div>
</div>

<script type="module">
import { IS_DEV, setIdentityUser, getIdentityUser, loadCompanies, resolveUserAccess } from './api.js';
import { mount as mountCalendar,   unmount as unmountCalendar   } from './calendar.js';
import { mount as mountAuditions,  unmount as unmountAuditions  } from './auditions.js';

let allCompanies = [];
let userAccess   = null;
let currentEditor = null;

const EDITORS = {
  calendar:  { label: 'Calendar Editor',  headerTitle: 'Edit Performances', displayUrl: '/calendar',  desc: 'Manage show runs and performances', icon: '📅', mount: mountCalendar,  unmount: unmountCalendar  },
  auditions: { label: 'Auditions Editor', headerTitle: 'Edit Auditions',    displayUrl: '/auditions', desc: 'Manage audition listings',          icon: '🎤', mount: mountAuditions, unmount: unmountAuditions },
};

async function init() {
  if (IS_DEV) {
    try {
      allCompanies = await loadCompanies();
    } catch(e) {
      console.warn('Dev: could not load companies:', e);
      allCompanies = [];
    }
    userAccess = { isAdmin: true, datasets: ['calendar', 'auditions'], company: null };
    showApp();
    showHub();
    return;
  }
  showLoginOverlay();
  initIdentity();
}

function showLoginOverlay() {
  document.getElementById('loginOverlay').style.display = '';
  document.getElementById('app').style.display = 'none';
}

function showApp() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('userLabel').textContent = IS_DEV ? 'dev mode' : (getIdentityUser()?.email || '');
}

function showHub() {
  document.getElementById('hubBtn').style.display = 'none';
  document.getElementById('topbarSubtitle').textContent = 'Data Editor';
  document.getElementById('topbarBrandLink').href = '/';
  document.getElementById('hubView').style.display = '';
  document.getElementById('editorContainer').style.display = 'none';
  if (currentEditor) {
    EDITORS[currentEditor]?.unmount();
    currentEditor = null;
  }
  renderTiles();
}

function renderTiles() {
  document.getElementById('datasetTiles').innerHTML = (userAccess?.datasets || []).map(key => {
    const ed = EDITORS[key];
    if (!ed) return '';
    return `
      <div class="tile" onclick="openEditor('${key}')">
        <div class="tile-icon">${ed.icon}</div>
        <div class="tile-label">${ed.label}</div>
        <div class="tile-desc">${ed.desc}</div>
        ${ed.stub ? '<span class="tile-badge">Coming soon</span>' : ''}
      </div>`;
  }).join('');
}

window.openEditor = function(key) {
  const ed = EDITORS[key];
  if (!ed) return;
  document.getElementById('hubView').style.display = 'none';
  document.getElementById('topbarSubtitle').textContent = ed.headerTitle || ed.label;
  document.getElementById('topbarBrandLink').href = ed.displayUrl || '/';
  const container = document.getElementById('editorContainer');
  container.style.display = '';
  document.getElementById('hubBtn').style.display = '';
  currentEditor = key;
  ed.mount(container, { ...userAccess, allCompanies });
};

window.goHub    = function() { showHub(); };
window.openLogin = function() { document.getElementById('loginError').style.display = 'none'; window.netlifyIdentity?.open(); };
window.signOut  = function() {
  if (IS_DEV) return;
  if (confirm('Sign out?')) window.netlifyIdentity?.logout();
};

function initIdentity() {
  if (!window.netlifyIdentity) return;
  window.netlifyIdentity.on('init',   async u => { if (u) { setIdentityUser(u); await onLoggedIn(u); } });
  window.netlifyIdentity.on('login',  async u => { setIdentityUser(u); window.netlifyIdentity.close(); await onLoggedIn(u); });
  window.netlifyIdentity.on('logout', () => {
    setIdentityUser(null);
    userAccess = null; allCompanies = []; currentEditor = null;
    showLoginOverlay();
  });
  window.netlifyIdentity.init({ APIUrl: 'https://santacruz.theater/.netlify/identity' });
}

async function onLoggedIn(user) {
  try {
    allCompanies = await loadCompanies();
    const access = resolveUserAccess(user.email, allCompanies);
    if (!access) {
      showLoginError('No editor access for this account. Contact the site administrator.');
      setTimeout(() => window.netlifyIdentity?.logout(), 3000);
      return;
    }
    userAccess = access;
    showApp();
    showHub();
  } catch(e) {
    showLoginError('Could not load data: ' + e.message);
  }
}

function showLoginError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = '';
}

init();
</script>
</body>
</html>
