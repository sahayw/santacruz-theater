<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .face { fill: #2c2c2c; }
    .detail { stroke: #ffffff; fill: none; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .face { fill: #f0ede8; }
      .detail { stroke: #2c2c2c; }
    }
  </style>
  <!-- comedy mask face -->
  <ellipse cx="16" cy="17" rx="12" ry="10" class="face"/>
  <!-- arched eyes (^ shape = comedy) -->
  <path d="M 9,15 Q 11.5,12 14,15" class="detail" stroke-width="2"/>
  <path d="M 18,15 Q 20.5,12 23,15" class="detail" stroke-width="2"/>
  <!-- upturned smile -->
  <path d="M 10,20 Q 16,26 22,20" class="detail" stroke-width="2.5"/>
</svg>
